<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot to PDF - Atılım Atılgan</title>
    <meta name="description" content="Paste screenshots from your clipboard, add a title, and export them as a single PDF. Everything runs in your browser.">
    <link rel="stylesheet" href="styles.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .sp-page {
            max-width: 960px;
            margin: 76px auto 40px;
            padding: 0 16px;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }
        .sp-page *, .sp-page *::before, .sp-page *::after { box-sizing: border-box; }

        .sp-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .sp-toolbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        .sp-toolbar p {
            font-size: 0.9rem;
            color: #64748b;
            margin: 4px 0 0;
        }
        .sp-actions { display: flex; flex-wrap: wrap; gap: 8px; }

        .sp-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #1e293b;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .sp-btn:hover:not(:disabled) { border-color: #2563eb; background: #eff6ff; }
        .sp-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        .sp-btn--primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .sp-btn--primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; }
        .sp-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .sp-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .sp-sheet {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }
        .sp-sheet.is-dragover { border-color: #2563eb; background: #f8fbff; }

        .sp-title {
            width: 100%;
            font: inherit;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: #1e293b;
            padding: 8px;
            margin-bottom: 32px;
            border: none;
            border-bottom: 2px solid #e2e8f0;
            background: transparent;
        }
        .sp-title:focus { outline: none; border-bottom-color: #2563eb; }

        .sp-images { display: flex; flex-direction: column; gap: 24px; }

        .sp-item { position: relative; }
        .sp-item img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }
        .sp-item__controls {
            position: absolute;
            top: -10px;
            right: -10px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sp-item:hover .sp-item__controls,
        .sp-item:focus-within .sp-item__controls { opacity: 1; }
        @media (hover: none) { .sp-item__controls { opacity: 1; } }
        .sp-icon-btn {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: none;
            background: #475569;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .sp-icon-btn:hover { background: #1e293b; }
        .sp-icon-btn--delete { background: #ef4444; }
        .sp-icon-btn--delete:hover { background: #dc2626; }
        .sp-icon-btn:disabled { display: none; }
        .sp-icon-btn svg { width: 16px; height: 16px; }

        .sp-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 48px 16px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            color: #64748b;
        }
        .sp-empty svg { width: 56px; height: 56px; margin-bottom: 16px; }
        .sp-empty h2 { font-size: 1.2rem; font-weight: 600; color: #475569; margin: 0; }
        .sp-empty p { margin: 8px 0 0; font-size: 0.95rem; line-height: 1.6; }
        .sp-empty kbd {
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f1f5f9;
            color: #1e293b;
        }
        .sp-note { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 16px; }

        @media (max-width: 600px) {
            .sp-sheet { padding: 20px; }
            .sp-title { font-size: 1.4rem; }
        }
    </style>
</head>

<body>

    <header class="header">
        <nav class="nav">
            <!-- Header loaded by scripts.js -->
        </nav>
    </header>

    <main class="sp-page">
        <div class="sp-toolbar">
            <h1>Screenshot to PDF</h1>
            <div class="sp-actions">
                <button type="button" class="sp-btn" id="sp-add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    Add images
                </button>
                <button type="button" class="sp-btn" id="sp-clear" disabled>Clear</button>
                <button type="button" class="sp-btn sp-btn--primary" id="sp-download" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span id="sp-download-label">Download PDF</span>
                </button>
                <input type="file" id="sp-file" accept="image/*" multiple hidden>
            </div>
        </div>

        <div class="sp-sheet" id="sp-sheet">
            <input type="text" class="sp-title" id="sp-title" value="Untitled Document" placeholder="Document Title" aria-label="Document title">
            <div class="sp-images" id="sp-images"></div>
            <div class="sp-empty" id="sp-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                <h2>Paste Your Screenshot</h2>
                <p>Press <kbd id="sp-mod">Ctrl</kbd> + <kbd>V</kbd> to add an image,<br>or drop image files here.</p>
            </div>
        </div>
        <p class="sp-note">Images stay in your browser; nothing is uploaded.</p>
    </main>

    <script src="scripts.js"></script>
    <script>
    (function () {
        const images = []; // { src, width, height }
        const els = {
            sheet: document.getElementById('sp-sheet'),
            list: document.getElementById('sp-images'),
            empty: document.getElementById('sp-empty'),
            title: document.getElementById('sp-title'),
            add: document.getElementById('sp-add'),
            file: document.getElementById('sp-file'),
            clear: document.getElementById('sp-clear'),
            download: document.getElementById('sp-download'),
            downloadLabel: document.getElementById('sp-download-label'),
        };
        let busy = false;

        if (/Mac|iPhone|iPad/.test(navigator.platform)) {
            document.getElementById('sp-mod').textContent = '⌘';
        }

        const ICONS = {
            up: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>',
            down: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>',
            del: '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>',
        };

        function iconButton(kind, label, onClick, disabled) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'sp-icon-btn' + (kind === 'del' ? ' sp-icon-btn--delete' : '');
            b.setAttribute('aria-label', label);
            b.title = label;
            b.disabled = !!disabled;
            b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">' + ICONS[kind] + '</svg>';
            b.addEventListener('click', onClick);
            return b;
        }

        function move(from, to) {
            const [item] = images.splice(from, 1);
            images.splice(to, 0, item);
            render();
        }

        function render() {
            els.list.textContent = '';
            images.forEach((img, i) => {
                const item = document.createElement('div');
                item.className = 'sp-item';
                const el = document.createElement('img');
                el.src = img.src;
                el.alt = 'Screenshot ' + (i + 1);
                const controls = document.createElement('div');
                controls.className = 'sp-item__controls';
                controls.append(
                    iconButton('up', 'Move up', () => move(i, i - 1), i === 0),
                    iconButton('down', 'Move down', () => move(i, i + 1), i === images.length - 1),
                    iconButton('del', 'Delete image', () => { images.splice(i, 1); render(); })
                );
                item.append(el, controls);
                els.list.appendChild(item);
            });
            const has = images.length > 0;
            els.empty.hidden = has;
            els.list.hidden = !has;
            els.clear.disabled = !has || busy;
            els.download.disabled = !has || busy;
        }

        // Read an image file/blob, normalising anything that isn't PNG/JPEG to PNG
        // so jsPDF can embed it.
        function addBlob(blob) {
            if (!blob || !blob.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let src = reader.result;
                    if (!/^data:image\/(png|jpe?g);/i.test(src)) {
                        const c = document.createElement('canvas');
                        c.width = img.naturalWidth;
                        c.height = img.naturalHeight;
                        c.getContext('2d').drawImage(img, 0, 0);
                        src = c.toDataURL('image/png');
                    }
                    images.push({ src, width: img.naturalWidth, height: img.naturalHeight });
                    render();
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(blob);
        }

        window.addEventListener('paste', (e) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            let found = false;
            for (const item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    addBlob(item.getAsFile());
                    found = true;
                }
            }
            if (found) e.preventDefault();
        });

        els.add.addEventListener('click', () => els.file.click());
        els.file.addEventListener('change', () => {
            Array.from(els.file.files).forEach(addBlob);
            els.file.value = '';
        });

        els.clear.addEventListener('click', () => {
            if (confirm('Remove all images?')) {
                images.length = 0;
                render();
            }
        });

        // Drag and drop
        ['dragenter', 'dragover'].forEach(t => els.sheet.addEventListener(t, (e) => {
            if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
                e.preventDefault();
                els.sheet.classList.add('is-dragover');
            }
        }));
        ['dragleave', 'drop'].forEach(t => els.sheet.addEventListener(t, () => els.sheet.classList.remove('is-dragover')));
        els.sheet.addEventListener('drop', (e) => {
            e.preventDefault();
            Array.from(e.dataTransfer.files).forEach(addBlob);
        });

        // Render the title onto a canvas so non-Latin characters (ı, ş, ğ, ...)
        // survive; jsPDF's built-in fonts only cover Latin-1.
        function titleCanvas(text, widthMm) {
            const pxPerMm = 12;
            const fontPx = 9 * pxPerMm;
            const lineH = fontPx * 1.25;
            const maxW = widthMm * pxPerMm;
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const font = '700 ' + fontPx + 'px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
            ctx.font = font;

            const lines = [];
            let line = '';
            for (const word of text.split(/\s+/)) {
                const test = line ? line + ' ' + word : word;
                if (line && ctx.measureText(test).width > maxW) {
                    lines.push(line);
                    line = word;
                } else {
                    line = test;
                }
            }
            if (line) lines.push(line);

            c.width = maxW;
            c.height = Math.ceil(lines.length * lineH + fontPx * 0.3);
            ctx.font = font;
            ctx.fillStyle = '#1e293b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            lines.forEach((l, i) => ctx.fillText(l, maxW / 2, i * lineH + fontPx * 0.1, maxW));
            return { canvas: c, heightMm: c.height / pxPerMm };
        }

        els.download.addEventListener('click', async () => {
            if (busy || images.length === 0) return;
            busy = true;
            els.downloadLabel.textContent = 'Generating...';
            render();
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                const pageW = pdf.internal.pageSize.getWidth();
                const pageH = pdf.internal.pageSize.getHeight();
                const margin = 15;
                const contentW = pageW - margin * 2;
                const contentH = pageH - margin * 2;
                let y = margin;

                const title = els.title.value.trim();
                if (title) {
                    const t = titleCanvas(title, contentW);
                    pdf.addImage(t.canvas.toDataURL('image/png'), 'PNG', margin, y, contentW, t.heightMm, undefined, 'FAST');
                    y += t.heightMm + 10;
                }

                for (const img of images) {
                    let w = contentW;
                    let h = img.height * w / img.width;
                    if (h > contentH) { // very tall screenshot: shrink to fit one page
                        h = contentH;
                        w = img.width * h / img.height;
                    }
                    if (y + h > pageH - margin) {
                        pdf.addPage();
                        y = margin;
                    }
                    const fmt = /^data:image\/png/i.test(img.src) ? 'PNG' : 'JPEG';
                    pdf.addImage(img.src, fmt, margin + (contentW - w) / 2, y, w, h, undefined, 'FAST');
                    y += h + 5;
                }

                const safe = title
                    .replace(/ı/g, 'i').replace(/İ/g, 'I')
                    .normalize('NFD').replace(/[̀-ͯ]/g, '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '_')
                    .replace(/^_+|_+$/g, '');
                pdf.save((safe || 'document') + '.pdf');
            } catch (err) {
                console.error('Error generating PDF:', err);
                alert('Sorry, there was an error creating the PDF. Please try again.');
            } finally {
                busy = false;
                els.downloadLabel.textContent = 'Download PDF';
                render();
            }
        });

        render();
    })();
    </script>
</body>

</html>
